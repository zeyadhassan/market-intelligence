name: CI

# Run static checks and the complete test suite against Postgres+pgvector
# and Neo4j on every push and pull request.

on:
  push: {}
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project (dev extras)
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fi_intel
          POSTGRES_PASSWORD: fi_intel
          POSTGRES_DB: fi_intel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fi_intel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/fi_intel
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FI_INTEL_REQUIRE_INFRA: "true"
      FI_INTEL_TEST_PG_DSN: postgresql://fi_intel:fi_intel@localhost:5432/fi_intel
      FI_INTEL_POSTGRES_DSN: postgresql://fi_intel:fi_intel@localhost:5432/fi_intel
      FI_INTEL_TEST_NEO4J_URI: bolt://localhost:7687
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project (dev extras)
        run: pip install -e ".[dev]"
      - name: Apply Postgres schema
        run: fi-intel db migrate
      - name: pytest (full suite, nothing skipped for missing infra)
        run: pytest
