name: release-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  governed-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install project
        run: python -m pip install --no-deps -e .
      - name: Install Podman Compose
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman podman-compose
      - name: Start and migrate Podman infrastructure
        run: python deploy/podman_infra.py up
      - name: Lint
        run: python -m ruff check .
      - name: Format gate
        run: python -m ruff format --check .
      - name: Type gate
        run: python -m mypy fi_intel
      - name: Full suite with mandatory infrastructure
        run: python deploy/podman_infra.py test
      - name: Stop Podman infrastructure
        if: always()
        run: python deploy/podman_infra.py down
