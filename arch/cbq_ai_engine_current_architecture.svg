<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">CBQ Markets AI Engine — current architecture</title>
  <desc id="desc">Current PostgreSQL-authoritative, graph-guided market intelligence architecture with durable workers, governed model services, push delivery, and pull decision support.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .group { stroke-width: 2.2; stroke-dasharray: 10 7; }
      .group-blue { fill: #dae8fc; fill-opacity: .42; stroke: #6c8ebf; }
      .group-purple { fill: #e1d5e7; fill-opacity: .50; stroke: #9673a6; }
      .group-orange { fill: #ffe6cc; fill-opacity: .50; stroke: #d79b00; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
      .edge { fill: none; stroke: #111111; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-both { fill: none; stroke: #111111; stroke-width: 2.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #111111; stroke-width: 2; stroke-dasharray: 8 6; }
      .title { font: 700 27px Arial, Helvetica, sans-serif; fill: #111111; }
      .group-label { font: 700 20px Arial, Helvetica, sans-serif; }
      .box-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; }
      .box-sub { font: italic 15px Arial, Helvetica, sans-serif; fill: #333333; text-anchor: middle; }
      .edge-label { font: 14px Arial, Helvetica, sans-serif; fill: #222222; text-anchor: middle; }
      .band-label { font: 700 15px Arial, Helvetica, sans-serif; fill: #444444; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1800" height="1120"/>
  <text class="title" x="45" y="43">CBQ Markets AI Engine — current architecture</text>

  <rect class="group group-blue" x="25" y="75" width="1750" height="605" rx="8"/>
  <text class="group-label" x="48" y="108" fill="#315b88">Continuous intelligence · PostgreSQL-authoritative, durable workers</text>

  <rect class="group group-purple" x="25" y="735" width="830" height="300" rx="8"/>
  <text class="group-label" x="48" y="770" fill="#5b3a67">Digest · push, scheduled</text>

  <rect class="group group-orange" x="900" y="735" width="875" height="300" rx="8"/>
  <text class="group-label" x="923" y="770" fill="#8a5a00">Decision support · pull, on demand</text>

  <!-- Edges are placed behind the service boxes. -->
  <path class="edge" d="M 260 180 H 320"/>
  <path class="edge" d="M 540 180 H 650"/>
  <path class="edge" d="M 430 225 V 300"/>
  <path class="edge" d="M 260 375 H 290 V 415 H 585 V 350 H 675"/>
  <path class="edge" d="M 815 300 V 320"/>
  <path class="edge" d="M 815 380 V 420"/>
  <path class="edge" d="M 650 500 H 550"/>
  <path class="edge" d="M 440 460 V 410 H 650 V 255"/>
  <path class="edge" d="M 870 480 H 915 V 250 H 1000"/>
  <path class="edge-both" d="M 950 245 H 970 V 480 H 990"/>
  <path class="edge" d="M 1115 305 V 420"/>
  <path class="edge-both" d="M 950 275 H 1245 V 480 H 1270"/>
  <path class="edge" d="M 1230 235 H 1250 V 455 H 1270"/>

  <!-- Governed model-call bus. -->
  <path class="edge-dashed" d="M 775 420 V 390 H 1605 V 240" marker-end="url(#arrow)"/>
  <path class="edge-dashed" d="M 1105 420 V 390"/>
  <path class="edge-dashed" d="M 1385 420 V 390"/>

  <!-- PostgreSQL is the coordination point for the API and delivery process. -->
  <path class="edge" d="M 700 300 V 395 H 610 V 705 H 185 V 815"/>
  <path class="edge-both" d="M 930 300 V 370 H 960 V 705 H 1050 V 815"/>
  <path class="edge" d="M 300 870 H 360"/>
  <path class="edge" d="M 590 870 H 690"/>
  <path class="edge-both" d="M 1180 870 H 1240"/>
  <path class="edge-both" d="M 1480 870 H 1585"/>

  <!-- Continuous intelligence nodes. -->
  <rect class="box" x="60" y="135" width="200" height="90"/>
  <text class="box-title" x="160" y="174">Official &amp; licensed</text>
  <text class="box-title" x="160" y="198">sources</text>

  <rect class="box" x="320" y="135" width="220" height="90"/>
  <text class="box-title" x="430" y="174">Source worker</text>
  <text class="box-sub" x="430" y="201">poll, archive, checkpoint</text>

  <rect class="box" x="60" y="330" width="200" height="90"/>
  <text class="box-title" x="160" y="369">Scheduler</text>
  <text class="box-sub" x="160" y="396">enqueue durable jobs</text>

  <path class="box" d="M 320 315 V 380 C 320 402 540 402 540 380 V 315 C 540 293 320 293 320 315 Z"/>
  <ellipse class="box" cx="430" cy="315" rx="110" ry="20"/>
  <text class="box-title" x="430" y="343">Raw archive</text>
  <text class="box-sub" x="430" y="370">immutable source bytes</text>

  <path class="box" d="M 650 130 V 278 C 650 307 980 307 980 278 V 130 C 980 101 650 101 650 130 Z"/>
  <ellipse class="box" cx="815" cy="130" rx="165" ry="27"/>
  <text class="box-title" x="815" y="178">PostgreSQL · authority</text>
  <text class="box-sub" x="815" y="207">ledger, temporal state, jobs, results</text>
  <text class="box-sub" x="815" y="232">pgvector chunks, identity, audit</text>
  <text class="box-sub" x="815" y="257">read models and delivery state</text>

  <rect class="box" x="675" y="320" width="280" height="60"/>
  <text class="box-title" x="815" y="346">Transactional outbox</text>
  <text class="box-sub" x="815" y="368">leases, replay, dead letters</text>

  <rect class="box" x="650" y="420" width="220" height="120"/>
  <text class="box-title" x="760" y="456">Document &amp;</text>
  <text class="box-title" x="760" y="480">projection worker</text>
  <text class="box-sub" x="760" y="508">chunk, resolve, extract,</text>
  <text class="box-sub" x="760" y="528">embed, project</text>

  <rect class="box" x="330" y="460" width="220" height="105"/>
  <text class="box-title" x="440" y="496">Entity resolution</text>
  <text class="box-title" x="440" y="520">review queue</text>
  <text class="box-sub" x="440" y="548">ambiguous links are held</text>

  <path class="box" d="M 1000 145 V 278 C 1000 305 1230 305 1230 278 V 145 C 1230 118 1000 118 1000 145 Z"/>
  <ellipse class="box" cx="1115" cy="145" rx="115" ry="25"/>
  <text class="box-title" x="1115" y="190">Neo4j · projection</text>
  <text class="box-sub" x="1115" y="218">rebuildable, bitemporal,</text>
  <text class="box-sub" x="1115" y="242">authorized 2-hop traversal</text>

  <rect class="box" x="990" y="420" width="230" height="120"/>
  <text class="box-title" x="1105" y="459">Analysis worker</text>
  <text class="box-sub" x="1105" y="486">graph/time detectors, hybrid</text>
  <text class="box-sub" x="1105" y="509">research, validation, admission</text>

  <rect class="box" x="1270" y="420" width="230" height="120"/>
  <text class="box-title" x="1385" y="459">Search worker</text>
  <text class="box-sub" x="1385" y="486">typed graph, vector,</text>
  <text class="box-sub" x="1385" y="509">and mixed retrieval plans</text>

  <rect class="box" x="1480" y="130" width="250" height="110"/>
  <text class="box-title" x="1605" y="169">LLM / embedding</text>
  <text class="box-title" x="1605" y="193">gateway</text>
  <text class="box-sub" x="1605" y="220">governed releases and lineage</text>

  <!-- Edge labels. -->
  <text class="edge-label" x="594" y="171">documents + coverage</text>
  <text class="edge-label" x="575" y="493">held decisions</text>
  <text class="edge-label" x="930" y="472">graph projection</text>
  <text class="edge-label" x="1095" y="375">bounded context</text>
  <text class="edge-label" x="1195" y="385">governed model calls</text>

  <!-- Push delivery. -->
  <rect class="box" x="70" y="815" width="230" height="110"/>
  <text class="box-title" x="185" y="854">Delivery worker</text>
  <text class="box-sub" x="185" y="881">reauthorize, render, suppress,</text>
  <text class="box-sub" x="185" y="903">send idempotently</text>

  <rect class="box" x="360" y="815" width="230" height="110"/>
  <text class="box-title" x="475" y="854">Sandbox email</text>
  <text class="box-sub" x="475" y="881">immutable result versions</text>
  <text class="box-sub" x="475" y="903">per authorized recipient</text>

  <circle class="box" cx="745" cy="870" r="55"/>
  <text class="box-title" x="745" y="878">Inbox</text>

  <!-- Pull decision support. -->
  <rect class="box" x="940" y="815" width="240" height="110"/>
  <text class="box-title" x="1060" y="854">Read-focused API</text>
  <text class="box-sub" x="1060" y="881">authorize, enqueue or join,</text>
  <text class="box-sub" x="1060" y="903">read PostgreSQL projections</text>

  <rect class="box" x="1240" y="815" width="240" height="110"/>
  <text class="box-title" x="1360" y="854">Analyst frontend</text>
  <text class="box-sub" x="1360" y="881">results, evidence, coverage,</text>
  <text class="box-sub" x="1360" y="903">search and evaluation</text>

  <circle class="box" cx="1640" cy="870" r="55"/>
  <text class="box-title" x="1640" y="878">User</text>

  <!-- Cross-cutting controls. -->
  <rect x="25" y="1060" width="1750" height="40" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.8"/>
  <text class="band-label" x="900" y="1086">OIDC &amp; entitlements   ·   model registry &amp; lineage   ·   temporal policy   ·   validation &amp; admission   ·   audit, metrics &amp; tracing</text>
</svg>
