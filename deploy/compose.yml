x-app: &app
  image: localhost/fi-intel:dev
  restart: unless-stopped
  profiles: ["app"]
  environment: &app-environment
    FI_INTEL_POSTGRES_DSN: postgresql://fi_intel:fi_intel@postgres:5432/fi_intel
    FI_INTEL_NEO4J_URI: bolt://neo4j:7687
    FI_INTEL_NEO4J_USER: neo4j
    FI_INTEL_NEO4J_PASSWORD: fi_intel
    FI_INTEL_RAW_ARCHIVE_PATH: /app/.fi-intel/archive
    FI_INTEL_EMAIL_SMTP_HOST: mailpit
    FI_INTEL_EMAIL_SMTP_PORT: "1025"
    FI_INTEL_ANALYSIS_MODE: ${FI_INTEL_ANALYSIS_MODE:-shadow}
    FI_INTEL_LLM_BASE_URL: ${FI_INTEL_LLM_BASE_URL:-}
    FI_INTEL_LLM_API_KEY: ${FI_INTEL_LLM_API_KEY:-not-needed}
    FI_INTEL_LLM_TRUST_ENV: ${FI_INTEL_LLM_TRUST_ENV:-true}
    FI_INTEL_LLM_TLS_VERIFY: ${FI_INTEL_LLM_TLS_VERIFY:-true}
    FI_INTEL_LLM_TIMEOUT_SECONDS: ${FI_INTEL_LLM_TIMEOUT_SECONDS:-120}
    FI_INTEL_LLM_STRUCTURED_OUTPUT_MODE: ${FI_INTEL_LLM_STRUCTURED_OUTPUT_MODE:-auto}
    FI_INTEL_LLM_BASIC_AUTH_USERNAME: ${FI_INTEL_LLM_BASIC_AUTH_USERNAME:-}
    FI_INTEL_LLM_BASIC_AUTH_PASSWORD: ${FI_INTEL_LLM_BASIC_AUTH_PASSWORD:-}
    FI_INTEL_EMBEDDING_BASE_URL: ${FI_INTEL_EMBEDDING_BASE_URL:-}
    FI_INTEL_EMBEDDING_API_KEY: ${FI_INTEL_EMBEDDING_API_KEY:-not-needed}
    FI_INTEL_EMBEDDING_TRUST_ENV: ${FI_INTEL_EMBEDDING_TRUST_ENV:-true}
    FI_INTEL_EMBEDDING_TLS_VERIFY: ${FI_INTEL_EMBEDDING_TLS_VERIFY:-true}
    FI_INTEL_EMBEDDING_TIMEOUT_SECONDS: ${FI_INTEL_EMBEDDING_TIMEOUT_SECONDS:-300}
    FI_INTEL_EMBEDDING_BATCH_SIZE: ${FI_INTEL_EMBEDDING_BATCH_SIZE:-8}
    FI_INTEL_EMBEDDING_BASIC_AUTH_USERNAME: ${FI_INTEL_EMBEDDING_BASIC_AUTH_USERNAME:-}
    FI_INTEL_EMBEDDING_BASIC_AUTH_PASSWORD: ${FI_INTEL_EMBEDDING_BASIC_AUTH_PASSWORD:-}
    FI_INTEL_EMBEDDING_MODEL: ${FI_INTEL_EMBEDDING_MODEL:-}
    FI_INTEL_EMBEDDING_DIM: ${FI_INTEL_EMBEDDING_DIM:-2048}
    FI_INTEL_EMBEDDING_QUERY_PREFIX: ${FI_INTEL_EMBEDDING_QUERY_PREFIX:-}
    FI_INTEL_EMBEDDING_DOCUMENT_PREFIX: ${FI_INTEL_EMBEDDING_DOCUMENT_PREFIX:-}
    FI_INTEL_EXTRACTION_MODEL: ${FI_INTEL_EXTRACTION_MODEL:-gpt-oss-120b}
    FI_INTEL_RESEARCH_MODEL: ${FI_INTEL_RESEARCH_MODEL:-gpt-oss-120b}
    FI_INTEL_ENTAILMENT_MODEL: ${FI_INTEL_ENTAILMENT_MODEL:-gpt-oss-120b}
    FI_INTEL_RERANKER_MODEL: ${FI_INTEL_RERANKER_MODEL:-gpt-oss-120b}
    FI_INTEL_COVERAGE_REQUIRED_SOURCE_IDS: ${FI_INTEL_COVERAGE_REQUIRED_SOURCE_IDS:-}
  volumes:
    - ../.fi-intel/archive:/app/.fi-intel/archive:Z
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fi_intel
      POSTGRES_PASSWORD: fi_intel
      POSTGRES_DB: fi_intel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fi_intel -d fi_intel"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: docker.io/library/neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/fi_intel
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p fi_intel 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    <<: *app
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${FI_INTEL_API_HOST_PORT:-8000}:8000"

  scheduler:
    <<: *app
    command: ["scheduler", "run"]

  source-worker:
    <<: *app
    environment:
      <<: *app-environment
      FI_INTEL_SOURCE_HTTP_PROXY: ${FI_INTEL_SOURCE_HTTP_PROXY:-}
      FI_INTEL_SOURCE_HTTPS_PROXY: ${FI_INTEL_SOURCE_HTTPS_PROXY:-}
      FI_INTEL_SOURCE_NO_PROXY: ${FI_INTEL_SOURCE_NO_PROXY:-}
      HTTP_PROXY: ${FI_INTEL_SOURCE_HTTP_PROXY:-}
      HTTPS_PROXY: ${FI_INTEL_SOURCE_HTTPS_PROXY:-}
      NO_PROXY: ${FI_INTEL_SOURCE_NO_PROXY:-}
      FI_INTEL_SOURCE_TLS_VERIFY: ${FI_INTEL_SOURCE_TLS_VERIFY:-true}
    command: ["worker", "source"]

  projection-worker:
    <<: *app
    command: ["worker", "projection"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  analysis-worker:
    <<: *app
    command: ["worker", "analysis"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  search-worker:
    <<: *app
    command: ["worker", "search"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  delivery-worker:
    <<: *app
    command: ["worker", "delivery"]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres_data:
  neo4j_data:
